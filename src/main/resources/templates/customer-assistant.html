<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>客户经理助手 - 银行信贷管理系统</title>
    <link rel="stylesheet" href="/css/common.css">
    <style>
        .assistant-container { display: flex; gap: 20px; margin-top: 20px; }
        .panel { background: white; border-radius: 8px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .reminder-panel { flex: 1; }
        .knowledge-panel { flex: 1; }
        .panel h3 { margin-top: 0; color: #333; border-bottom: 2px solid #409eff; padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .reminder-item { padding: 12px; border-left: 4px solid #409eff; background: #f5f7fa; margin-bottom: 10px; border-radius: 4px; }
        .reminder-item.high { border-left-color: #f56c6c; }
        .reminder-item.medium { border-left-color: #e6a23c; }
        .reminder-item.low { border-left-color: #409eff; }
        .reminder-title { font-weight: bold; margin-bottom: 5px; }
        .reminder-meta { font-size: 12px; color: #999; }
        .knowledge-item { padding: 10px; border-bottom: 1px solid #eee; cursor: pointer; }
        .knowledge-item:hover { background: #f5f7fa; }
        .knowledge-item a { color: #409eff; text-decoration: none; }
        .knowledge-tags { margin-top: 5px; }
        .tag { display: inline-block; background: #ecf5ff; color: #409eff; padding: 2px 8px; border-radius: 3px; font-size: 12px; margin-right: 5px; }
        .filter-bar { margin-bottom: 15px; }
        .filter-bar select, .filter-bar input { padding: 6px; border: 1px solid #dcdfe6; border-radius: 4px; }
        .filter-bar button { padding: 6px 15px; background: #409eff; color: white; border: none; border-radius: 4px; cursor: pointer; margin-left: 5px; }
        .filter-bar button:hover { background: #66b1ff; }
        .filter-bar button.danger { background: #f56c6c; }
        .filter-bar button.danger:hover { background: #f78989; }
        .empty-tip { text-align: center; color: #999; padding: 30px; }
        
        .stats-bar { display: flex; gap: 15px; margin-bottom: 15px; }
        .stat-item { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 15px 20px; border-radius: 8px; text-align: center; flex: 1; }
        .stat-item.pending { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
        .stat-item.high { background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%); color: #333; }
        .stat-item.resolved { background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%); color: #333; }
        .stat-number { font-size: 28px; font-weight: bold; }
        .stat-label { font-size: 12px; margin-top: 5px; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; }
        .modal.show { display: flex; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 25px; border-radius: 8px; max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .modal-header h4 { margin: 0; }
        .modal-close { background: none; border: none; font-size: 20px; cursor: pointer; color: #999; }
        .modal-close:hover { color: #333; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 500; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px; border: 1px solid #dcdfe6; border-radius: 4px; box-sizing: border-box; }
        .form-group textarea { height: 100px; resize: vertical; }
        .btn { padding: 8px 20px; border: none; border-radius: 4px; cursor: pointer; }
        .btn-primary { background: #409eff; color: white; }
        .btn-primary:hover { background: #66b1ff; }
        .btn-default { background: #fff; border: 1px solid #dcdfe6; color: #606266; }
        .btn-default:hover { background: #f5f7fa; }
        .btn-success { background: #67c23a; color: white; }
        .btn-success:hover { background: #85ce61; }
        .btn-danger { background: #f56c6c; color: white; }
        .btn-danger:hover { background: #f78989; }
        .btn-sm { padding: 4px 10px; font-size: 12px; }
        .action-bar { margin-top: 8px; display: flex; gap: 5px; }
        .article-content { white-space: pre-wrap; line-height: 1.6; }
        
        /* 站内消息通知栏样式 */
        .notification-bar {
            background: #fff;
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .notification-bar strong {
            color: #f56c6c;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <!-- 顶部导航栏 -->
    <div class="top-nav">
        <div class="logo">银行信贷管理系统</div>
        <div class="user-info">
            <span id="username">管理员</span>
            <button class="logout-btn" onclick="logout()">退出</button>
        </div>
    </div>

    <!-- 布局容器 -->
    <div class="layout-container">
        <!-- 左侧菜单 -->
        <div class="left-menu">
            <a href="/index" class="menu-item">📊 工作台</a>
            <a href="/application" class="menu-item">📋 申请管理</a>
            <a href="/approval" class="menu-item">✓ 审批管理</a>
            <a href="/contract" class="menu-item">📄 合同管理</a>
            <a href="/loan" class="menu-item">💰 放款管理</a>
            <a href="/repayment" class="menu-item">🔄 还款管理</a>
            <a href="/warning" class="menu-item">⚠️ 预警管理</a>
            <a href="/postloan" class="menu-item">📈 贷后管理</a>
            <a href="/user" class="menu-item">👥 用户管理</a>
            <a href="/role" class="menu-item">👨‍💼 角色管理</a>
            <a href="/workflow" class="menu-item">⚙️ 流程管理</a>
            <a href="/report" class="menu-item">📊 报表管理</a>
            <a href="/customer-assistant" class="menu-item active">🤖 客户经理助手</a>
        </div>

        <!-- 主内容区 -->
        <div class="main-content">
            <h2>🤖 客户经理助手</h2>
        
        <div class="stats-bar" id="statsBar"></div>
        
        <!-- 站内消息通知栏 -->
        <div class="notification-bar" id="notificationBar">
            <span>📬 您有 <strong id="unreadCount">0</strong> 条未读消息</span>
            <button class="btn btn-sm btn-primary" onclick="loadNotifications()">查看消息</button>
            <button class="btn btn-sm btn-default" onclick="markAllAsRead()">全部已读</button>
        </div>
        
        <div class="assistant-container">
            <div class="panel reminder-panel">
                <h3>
                    <span>⏰ 待处理提醒</span>
                    <button class="btn btn-primary btn-sm" onclick="showCreateReminderModal()">+ 新建提醒</button>
                </h3>
                <div class="filter-bar">
                    <select id="reminderType">
                        <option value="">全部类型</option>
                        <option value="APPLICATION_EXPIRE">申请过期</option>
                        <option value="MATERIAL_EXPIRE">材料过期</option>
                        <option value="APPROVAL_TIMEOUT">审批超时</option>
                        <option value="FOLLOWUP_REQUIRED">客户回访</option>
                        <option value="LOAN_RENEW">续贷提醒</option>
                    </select>
                    <select id="reminderStatus">
                        <option value="">全部状态</option>
                        <option value="PENDING">待处理</option>
                        <option value="NOTIFIED">已通知</option>
                        <option value="RESOLVED">已解决</option>
                    </select>
                    <button onclick="loadReminders()">查询</button>
                </div>
                <div id="reminderList"></div>
            </div>
            <div class="panel knowledge-panel">
                <h3>
                    <span>📚 知识库</span>
                    <button class="btn btn-primary btn-sm" onclick="showHotArticles()">🔥 热门</button>
                </h3>
                <div class="filter-bar">
                    <select id="category">
                        <option value="">全部分类</option>
                        <option value="BUSINESS_PROCESS">业务流程</option>
                        <option value="FAQ">常见问题</option>
                        <option value="PRODUCT_INFO">产品信息</option>
                        <option value="APPROVAL_STANDARD">审批标准</option>
                    </select>
                    <input type="text" id="keyword" placeholder="搜索关键词">
                    <button onclick="loadKnowledge()">搜索</button>
                </div>
                <div id="knowledgeList"></div>
            </div>
        </div>
    </div>
    </div>

    <!-- 弹窗组件 -->
    <div class="modal" id="articleModal">
    <div class="modal-content">
        <div class="modal-header">
            <h4 id="articleTitle">文章详情</h4>
            <button class="modal-close" onclick="closeModal('articleModal')">&times;</button>
        </div>
        <div id="articleBody"></div>
    </div>
</div>

<div class="modal" id="reminderModal">
    <div class="modal-content">
        <div class="modal-header">
            <h4>新建提醒</h4>
            <button class="modal-close" onclick="closeModal('reminderModal')">&times;</button>
        </div>
        <form id="reminderForm">
            <div class="form-group">
                <label>客户 ID</label>
                <input type="number" id="newCustomerId" required>
            </div>
            <div class="form-group">
                <label>提醒类型</label>
                <select id="newReminderType" required>
                    <option value="APPLICATION_EXPIRE">申请过期</option>
                    <option value="MATERIAL_EXPIRE">材料过期</option>
                    <option value="APPROVAL_TIMEOUT">审批超时</option>
                    <option value="FOLLOWUP_REQUIRED">客户回访</option>
                    <option value="LOAN_RENEW">续贷提醒</option>
                </select>
            </div>
            <div class="form-group">
                <label>标题</label>
                <input type="text" id="newTitle" required>
            </div>
            <div class="form-group">
                <label>内容</label>
                <textarea id="newContent"></textarea>
            </div>
            <div class="form-group">
                <label>优先级</label>
                <select id="newPriority">
                    <option value="1">低</option>
                    <option value="2" selected>中</option>
                    <option value="3">高</option>
                </select>
            </div>
            <div class="form-group">
                <label>截止时间</label>
                <input type="datetime-local" id="newDueDate" required>
            </div>
            <div style="text-align: right;">
                <button type="button" class="btn btn-default" onclick="closeModal('reminderModal')">取消</button>
                <button type="submit" class="btn btn-primary">保存</button>
            </div>
        </form>
    </div>
</div>

<!-- 站内消息弹窗 -->
<div class="modal" id="notificationModal">
    <div class="modal-content">
        <div class="modal-header">
            <h4>站内消息</h4>
            <button class="modal-close" onclick="closeModal('notificationModal')">&times;</button>
        </div>
        <div id="notificationList"></div>
    </div>
</div>

<script>
const API_BASE = '/api/customer-assistant';

function loadStats() {
    fetch(`${API_BASE}/reminders/stats`)
        .then(res => res.json())
        .then(data => {
            if (!data.data) return;
            const s = data.data;
            document.getElementById('statsBar').innerHTML = `
                <div class="stat-item pending">
                    <div class="stat-number">${s.pending || 0}</div>
                    <div class="stat-label">待处理</div>
                </div>
                <div class="stat-item high">
                    <div class="stat-number">${s.highPriority || 0}</div>
                    <div class="stat-label">高优先级</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number">${s.notified || 0}</div>
                    <div class="stat-label">已通知</div>
                </div>
                <div class="stat-item resolved">
                    <div class="stat-number">${s.resolved || 0}</div>
                    <div class="stat-label">已解决</div>
                </div>
            `;
        });
}

function loadReminders() {
    const type = document.getElementById('reminderType').value;
    const status = document.getElementById('reminderStatus').value;
    let url = `${API_BASE}/reminders?`;
    if (type) url += `type=${type}&`;
    if (status) url += `status=${status}&`;

    fetch(url)
        .then(res => res.json())
        .then(data => {
            const container = document.getElementById('reminderList');
            if (!data.data || data.data.length === 0) {
                container.innerHTML = '<div class="empty-tip">暂无提醒</div>';
                return;
            }
            container.innerHTML = data.data.map(r => {
                const priorityClass = r.priority >= 3 ? 'high' : r.priority >= 2 ? 'medium' : 'low';
                const statusText = r.status === 'PENDING' ? '待处理' : r.status === 'NOTIFIED' ? '已通知' : '已解决';
                return `
                    <div class="reminder-item ${priorityClass}">
                        <div class="reminder-title">${r.title} <span style="font-size:12px;color:#999;">[${r.reminderTypeDescription || ''}]</span></div>
                        ${r.customerName ? `<div style="font-size:13px;color:#666;">客户: ${r.customerName} ${r.customerPhone ? '(' + r.customerPhone + ')' : ''}</div>` : ''}
                        <div class="reminder-meta">截止: ${formatDateTime(r.dueDate)} | 状态: ${statusText}</div>
                        ${r.content ? `<div style="margin-top:5px;font-size:13px;color:#666;">${r.content}</div>` : ''}
                        ${r.status !== 'RESOLVED' ? `
                        <div class="action-bar">
                            <button class="btn btn-success btn-sm" onclick="resolveReminder(${r.id})">标记已处理</button>
                            <button class="btn btn-danger btn-sm" onclick="deleteReminder(${r.id})">删除</button>
                        </div>
                        ` : `<div style="margin-top:5px;color:#67c23a;font-size:12px;">✓ 已解决 ${r.resolutionNote ? '- ' + r.resolutionNote : ''}</div>`}
                    </div>
                `;
            }).join('');
        });
    loadStats();
}

function loadKnowledge() {
    const category = document.getElementById('category').value;
    const keyword = document.getElementById('keyword').value;
    let url = `${API_BASE}/knowledge?`;
    if (category) url += `category=${category}&`;
    if (keyword) url += `keyword=${encodeURIComponent(keyword)}&`;

    fetch(url)
        .then(res => res.json())
        .then(data => {
            renderKnowledgeList(data.data);
        });
}

function showHotArticles() {
    fetch(`${API_BASE}/knowledge/hot?limit=5`)
        .then(res => res.json())
        .then(data => {
            renderKnowledgeList(data.data);
        });
}

function renderKnowledgeList(articles) {
    const container = document.getElementById('knowledgeList');
    if (!articles || articles.length === 0) {
        container.innerHTML = '<div class="empty-tip">未找到相关文章</div>';
        return;
    }
    container.innerHTML = articles.map(a => `
        <div class="knowledge-item" onclick="showArticle(${a.id})">
            <a href="#" onclick="return false;">${a.title}</a>
            <div class="knowledge-tags">
                ${(a.tags || '').split(',').filter(t => t.trim()).map(t => `<span class="tag">${t.trim()}</span>`).join('')}
            </div>
            <div class="reminder-meta">浏览: ${a.viewCount || 0}次 | ${a.categoryDescription || ''}</div>
        </div>
    `).join('');
}

function showArticle(id) {
    fetch(`${API_BASE}/knowledge/${id}`)
        .then(res => res.json())
        .then(data => {
            if (!data.data) { alert('文章不存在'); return; }
            const a = data.data;
            document.getElementById('articleTitle').textContent = a.title;
            document.getElementById('articleBody').innerHTML = `
                <div style="margin-bottom:10px;color:#999;font-size:12px;">
                    分类: ${a.categoryDescription || ''} | 浏览: ${a.viewCount || 0}次
                </div>
                <div class="article-content">${a.content || ''}</div>
                ${a.tags ? `<div class="knowledge-tags" style="margin-top:15px;">${a.tags.split(',').filter(t => t.trim()).map(t => `<span class="tag">${t.trim()}</span>`).join('')}</div>` : ''}
            `;
            document.getElementById('articleModal').classList.add('show');
        });
}

function closeModal(modalId) {
    document.getElementById(modalId).classList.remove('show');
}

function resolveReminder(id) {
    if (!confirm('确认标记该提醒为已处理？')) return;
    fetch(`${API_BASE}/reminders/resolve`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ reminderId: id, note: '已处理' })
    })
    .then(res => res.json())
    .then(data => {
        if (data.code === 200) {
            loadReminders();
        } else {
            alert(data.message || '操作失败');
        }
    });
}

function deleteReminder(id) {
    if (!confirm('确认删除该提醒？')) return;
    fetch(`${API_BASE}/reminders/${id}`, { method: 'DELETE' })
        .then(res => res.json())
        .then(data => {
            if (data.code === 200) {
                loadReminders();
            } else {
                alert(data.message || '删除失败');
            }
        });
}

function showCreateReminderModal() {
    document.getElementById('reminderForm').reset();
    const now = new Date();
    now.setHours(now.getHours() + 24);
    document.getElementById('newDueDate').value = now.toISOString().slice(0, 16);
    document.getElementById('reminderModal').classList.add('show');
}

document.getElementById('reminderForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const reminder = {
        customerId: parseInt(document.getElementById('newCustomerId').value),
        reminderType: document.getElementById('newReminderType').value,
        title: document.getElementById('newTitle').value,
        content: document.getElementById('newContent').value,
        priority: parseInt(document.getElementById('newPriority').value),
        dueDate: document.getElementById('newDueDate').value.replace('T', ' ') + ':00'
    };
    
    fetch(`${API_BASE}/reminders`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(reminder)
    })
    .then(res => res.json())
    .then(data => {
        if (data.code === 200) {
            closeModal('reminderModal');
            loadReminders();
        } else {
            alert(data.message || '创建失败');
        }
    });
});

function formatDateTime(dateStr) {
    if (!dateStr) return '无';
    return dateStr.replace('T', ' ').substring(0, 16);
}

// ==================== 站内消息功能 ====================
const NOTIFICATION_API = '/api/notifications';

function loadUnreadCount() {
    fetch(`${NOTIFICATION_API}/unread-count`)
        .then(res => res.json())
        .then(data => {
            document.getElementById('unreadCount').textContent = data.data || 0;
        });
}

function loadNotifications() {
    fetch(`${NOTIFICATION_API}?isRead=false`)
        .then(res => res.json())
        .then(data => {
            const container = document.getElementById('notificationList');
            if (!data.data || data.data.length === 0) {
                container.innerHTML = '<div class="empty-tip">暂无未读消息</div>';
            } else {
                container.innerHTML = data.data.map(n => `
                    <div class="reminder-item ${n.priority >= 3 ? 'high' : ''}">
                        <div class="reminder-title">${n.title}</div>
                        <div class="reminder-meta">${formatDateTime(n.createdAt)}</div>
                        <div style="margin-top:5px;font-size:13px;">${n.content}</div>
                        <div class="action-bar">
                            <button class="btn btn-success btn-sm" onclick="markAsRead(${n.id})">标记已读</button>
                            <button class="btn btn-danger btn-sm" onclick="deleteNotification(${n.id})">删除</button>
                        </div>
                    </div>
                `).join('');
            }
            document.getElementById('notificationModal').classList.add('show');
        });
}

function markAsRead(id) {
    fetch(`${NOTIFICATION_API}/${id}/read`, { method: 'PUT' })
        .then(() => {
            loadNotifications();
            loadUnreadCount();
        });
}

function markAllAsRead() {
    fetch(`${NOTIFICATION_API}/mark-all-read`, { method: 'POST' })
        .then(() => {
            loadUnreadCount();
            alert('已全部标记为已读');
        });
}

function deleteNotification(id) {
    if (!confirm('确认删除该消息？')) return;
    fetch(`${NOTIFICATION_API}/${id}`, { method: 'DELETE' })
        .then(() => {
            loadNotifications();
            loadUnreadCount();
        });
}

document.addEventListener('DOMContentLoaded', () => {
    loadStats();
    loadReminders();
    loadKnowledge();
    loadUnreadCount();
    // 每 30 秒刷新一次未读数
    setInterval(loadUnreadCount, 30000);
});
</script>
</body>
</html>
